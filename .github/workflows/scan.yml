name: CMC 10-asset hourly scan
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cmc-hourly-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner.py
      - name: Publish report to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/latest.json reports/latest.md
          if ! git diff --cached --quiet; then
            git commit -m 'Update hourly CMC scan report'
            git push
          fi
      - name: Send report to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          report = pathlib.Path("reports/latest.md").read_text(
              encoding="utf-8"
          )

          message = "📊 CMC 每小时扫描报告\n\n" + report
          message = message[:3900]

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message
          }).encode("utf-8")

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          request = urllib.request.Request(url, data=data)
          with urllib.request.urlopen(request, timeout=30) as response:
              print("Telegram notification sent:", response.status)
          PY
