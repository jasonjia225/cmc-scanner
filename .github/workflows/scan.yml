name: CMC 10-asset hourly scan
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cmc-hourly-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner.py
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: ${{ vars.OANDA_ENV }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TWELVE_DATA_NDX_SYMBOL: ${{ vars.TWELVE_DATA_NDX_SYMBOL }}
          TWELVE_DATA_DAX_SYMBOL: ${{ vars.TWELVE_DATA_DAX_SYMBOL }}
          TWELVE_DATA_HSI_SYMBOL: ${{ vars.TWELVE_DATA_HSI_SYMBOL }}
      - name: Publish report to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/latest.json reports/latest.md
          if ! git diff --cached --quiet; then
            git commit -m 'Update hourly CMC scan report'
            git push
          fi
      - name: Send report to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_send.py reports/latest.md
env:
  OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
  OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
  OANDA_ENV: practice
