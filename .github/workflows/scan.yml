name: CMC 14-asset scan
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cmc-hourly-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Diagnose OANDA practice connection
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        run: |
          python - <<'PYCODE'
          import os, requests
          from datetime import datetime, timezone
          token = os.getenv('OANDA_API_TOKEN')
          account = os.getenv('OANDA_ACCOUNT_ID')
          if not token or not account:
              print('OANDA: missing token or account ID')
          else:
              base = 'https://api-fxpractice.oanda.com/v3'
              headers = {'Authorization': 'Bearer ' + token}
              for symbol in ('XAU_USD', 'XAG_USD', 'WTICO_USD'):
                  try:
                      r = requests.get(f'{base}/accounts/{account}/pricing', headers=headers, params={'instruments': symbol}, timeout=15)
                      print(f'OANDA {symbol}: HTTP {r.status_code}')
                      if r.ok:
                          for q in r.json().get('prices', []):
                              print('  time:', q.get('time'), 'tradeable:', q.get('tradeable'), 'status:', q.get('status'))
                          if not r.json().get('prices'):
                              print('  no prices returned')
                  except (requests.RequestException, ValueError) as e:
                      print(f'OANDA {symbol}: {type(e).__name__}')
          PYCODE
      - run: python scanner.py
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENV: practice
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TWELVE_DATA_NDX_SYMBOL: ${{ vars.TWELVE_DATA_NDX_SYMBOL }}
          TWELVE_DATA_DAX_SYMBOL: ${{ vars.TWELVE_DATA_DAX_SYMBOL }}
          TWELVE_DATA_HSI_SYMBOL: ${{ vars.TWELVE_DATA_HSI_SYMBOL }}
      - name: Publish report to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/latest.json reports/latest.md
          if ! git diff --cached --quiet; then
            git commit -m 'Update hourly CMC scan report'
            git push
          fi
      - name: Send report to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_send.py reports/latest.md
